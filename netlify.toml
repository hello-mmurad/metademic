# Netlify deployment configuration for the Metademic Next.js app.
# Netlify's OpenNext adapter is applied automatically; do not pin
# @netlify/plugin-nextjs unless you intentionally need a legacy adapter.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
